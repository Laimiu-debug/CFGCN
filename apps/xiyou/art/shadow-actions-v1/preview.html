<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>西游皮影 · 招式台</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/theme.css" />
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: var(--font-body);
      background: var(--paper);
      color: var(--ink);
    }
    header,
    main {
      max-width: 1500px;
      margin: auto;
    }
    h1 {
      font: 28px var(--serif);
      margin: 0 0 8px;
    }
    p {
      color: var(--muted);
      line-height: 1.6;
      margin: 8px 0;
    }
    nav,
    .controls,
    .scrub {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    nav {
      margin-top: 12px;
    }
    .series-button {
      padding: 8px 13px;
    }
    .series-button[aria-pressed='true'] {
      outline: 2px solid var(--jade);
      outline-offset: 2px;
    }
    select {
      font: inherit;
      padding: 8px;
      background: var(--paper);
      color: var(--ink);
      border: 1px solid var(--line);
      max-width: 100%;
    }
    select:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--jade);
      outline-offset: 3px;
    }
    .controls {
      margin: 14px 0;
    }
    .scrub input {
      width: min(460px, 60vw);
      accent-color: var(--jade);
    }
    canvas {
      display: block;
      width: 100%;
      height: clamp(290px, calc(100dvh - 375px), 650px);
    }
    output {
      font-variant-numeric: tabular-nums;
    }
    #stage-label {
      font: 20px var(--serif);
      color: var(--ink);
    }
    footer {
      border-top: 1px solid var(--line);
      padding-top: 10px;
    }
    #timeline {
      display: flex;
      gap: 6px;
      height: 5px;
      margin: 12px 0;
      background: var(--line);
    }
    #timeline span {
      background: var(--jade);
      width: 0;
    }
    @media (max-width: 600px) {
      body {
        padding: 12px;
      }
      h1 {
        font-size: 23px;
      }
      nav {
        gap: 8px;
      }
      .series-button {
        padding: 8px 10px;
      }
      canvas {
        height: 45dvh;
        min-height: 300px;
      }
    }
  </style>
  <header>
    <h1>西游皮影 · 招式台</h1>
    <p>八人各自三招，加受击与后撤。实际 GLB 骨骼动作，可逐帧检查起手、接触与收势。</p>
    <label
      >检查角色
      <select id="character" aria-label="检查角色"></select
    ></label>
    <nav id="actions" aria-label="技能动作"></nav>
    <div class="controls">
      <button class="series-button series-button--primary" id="play">重新出招</button>
      <button class="series-button series-button--secondary" id="pause" aria-pressed="false">
        暂停
      </button>
      <button class="series-button series-button--secondary" id="moving" aria-pressed="false">
        走动施法
      </button>
      <button class="series-button series-button--secondary" id="slow" aria-pressed="false">
        半速
      </button>
      <button class="series-button series-button--secondary" id="loop" aria-pressed="true">
        循环演练
      </button>
      <button class="series-button series-button--secondary" id="flip" aria-pressed="false">
        左右翻面
      </button>
    </div>
    <div class="scrub">
      <label for="phase">动作进度</label
      ><input
        id="phase"
        aria-label="动作进度"
        type="range"
        min="0"
        max="100"
        step="1"
        value="0"
      /><output id="clock">0.00 s</output><output id="gait-clock" hidden></output>
    </div>
    <div id="timeline" aria-hidden="true"><span></span></div>
    <p id="status" role="status">正在载入动作库…</p>
  </header>
  <main>
    <canvas aria-label="皮影技能实际模型预览"></canvas>
    <p id="stage-label"></p>
    <p id="events"></p>
    <footer>
      <p>
        本地动作候选。移动施法使用下身步态与上身独立轨道；后撤位移单独记录，正式接入时须经过地图碰撞。手片保留现有画稿，精细指形、技能特效和战斗命中尚待接入审阅。
      </p>
    </footer>
  </main>
  <script type="importmap">
    { "imports": { "three": "/lib/build/three.module.js", "three/addons/": "/lib/examples/jsm/" } }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    const $ = (s) => document.querySelector(s),
      css = getComputedStyle(document.documentElement);
    const records = (await (await fetch('/catalog.json')).json()).characters;
    const canvas = $('canvas'),
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    renderer.setClearColor(css.getPropertyValue('--paper').trim());
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    const scene = new THREE.Scene(),
      camera = new THREE.OrthographicCamera(-3, 3, 3, -0.3, 0.01, 100);
    camera.position.z = 10;
    const points = [new THREE.Vector3(-12, 0, -0.2), new THREE.Vector3(12, 0, -0.2)];
    for (let x = -12; x <= 12; x += 0.5)
      points.push(new THREE.Vector3(x, 0, -0.2), new THREE.Vector3(x, -0.03, -0.2));
    scene.add(
      new THREE.LineSegments(
        new THREE.BufferGeometry().setFromPoints(points),
        new THREE.LineBasicMaterial({ color: css.getPropertyValue('--line').trim() }),
      ),
    );
    let current,
      spec,
      full,
      upper,
      gait,
      moving = false,
      paused = matchMedia('(prefers-reduced-motion: reduce)').matches,
      slow = false,
      loop = true,
      flip = false;
    let time = 0,
      gaitTime = 0,
      gaitStart = 0,
      last = performance.now(),
      sequence = 0;
    const cache = new Map(),
      loader = new GLTFLoader();
    const qa = (window.actionQA = { ready: false, errors: [], records, renderer, scene, camera });
    function resize() {
      if (!current) return;
      const w = canvas.clientWidth,
        h = canvas.clientHeight;
      renderer.setSize(w, h, false);
      const height = current.record.height,
        b = current.record.inspection_bounds?.[spec?.clip];
      camera.top = b ? b[3] + height * 0.08 : height * 1.72;
      camera.bottom = b ? Math.min(0, b[1]) - height * 0.06 : -height * 0.12;
      let half = (camera.top - camera.bottom) / 2;
      const required = b ? Math.max(Math.abs(b[0]), Math.abs(b[2])) + height * 0.15 : 0;
      if ((half * w) / h < required) {
        const mid = (camera.top + camera.bottom) / 2;
        half = (required * h) / w;
        camera.top = mid + half;
        camera.bottom = mid - half;
      }
      camera.left = (-half * w) / h;
      camera.right = (half * w) / h;
      camera.updateProjectionMatrix();
    }
    new ResizeObserver(resize).observe(canvas);
    function pausedUI() {
      $('#pause').setAttribute('aria-pressed', String(paused));
      $('#pause').textContent = paused ? '继续' : '暂停';
    }
    function selectModule(next, replay = true, preserveGait = true) {
      if (!current) return;
      if (preserveGait && spec && moving && gait) {
        gaitTime = gaitStart + Math.min(time, spec.duration);
      }
      spec = next;
      current.mixer.stopAllAction();
      time = 0;
      gaitStart = gaitTime;
      const find = (name) =>
        current.mixer
          .clipAction(THREE.AnimationClip.findByName(current.clips, name))
          .reset()
          .setLoop(THREE.LoopOnce, 1);
      full = find(spec.clip);
      full.clampWhenFinished = true;
      if (spec.upper_clip) {
        upper = find(spec.upper_clip);
        upper.clampWhenFinished = true;
        gait = find('WalkLower');
        gait.setLoop(THREE.LoopRepeat, Infinity);
      } else {
        upper = gait = null;
      }
      if (moving && upper) {
        upper.play();
        gait.play();
      } else full.play();
      for (const b of $('#actions').children)
        b.setAttribute('aria-pressed', String(b.dataset.clip === spec.clip));
      $('#moving').disabled = !spec.upper_clip;
      if (replay) paused = false;
      pausedUI();
      sample();
      qa.current = {
        id: current.record.id,
        clip: spec.clip,
        upper: spec.upper_clip,
        duration: spec.duration,
      };
      resize();
    }
    function sample() {
      if (!current || !spec) return;
      const p = Math.min(time / spec.duration, 1),
        action = moving && upper ? upper : full;
      action.time = p * action.getClip().duration;
      if (moving && gait)
        gait.time = (gaitStart + Math.min(time, spec.duration)) % gait.getClip().duration;
      current.mixer.update(0);
      current.wrapper.scale.x = flip ? -1 : 1;
      let x = 0;
      if (moving && upper)
        x =
          ((Math.min(time, spec.duration) - spec.duration / 2) * current.record.walk_distance) /
          current.record.walk_period;
      if (spec.root_motion) {
        const u = THREE.MathUtils.clamp((p - 0.14) / 0.74, 0, 1);
        x = spec.root_motion.distance * u * u * (3 - 2 * u);
      }
      current.wrapper.position.x = x * (flip ? -1 : 1);
      const phase = p * 100;
      $('#phase').value = phase;
      $('#clock').textContent =
        Math.min(time, spec.duration).toFixed(2) + ' s / ' + spec.duration.toFixed(2) + ' s';
      $('#timeline span').style.width = phase + '%';
      const stage =
        time < spec.windup_end
          ? '起手 · 蓄力'
          : time < spec.release_end
            ? '发力 · 接触 / 释放'
            : p < 1
              ? '收势 · 回到备势'
              : '备势';
      $('#stage-label').textContent = current.record.name + ' · ' + spec.label + ' · ' + stage;
      $('#events').textContent =
        '释放时点 ' +
        spec.events.map((e) => e.time.toFixed(3) + ' s').join('、') +
        ' · ' +
        (moving && upper ? '走路相位连续，腿部独立' : '完整身体动作');
      qa.phase = p;
      qa.moving = moving && !!upper;
      qa.time = time;
      qa.gaitTime = gaitStart + Math.min(time, spec.duration);
      $('#gait-clock').hidden = !(moving && gait);
      if (moving && gait) {
        $('#gait-clock').textContent =
          '步态 ' +
          (((qa.gaitTime % gait.getClip().duration) / gait.getClip().duration) * 100).toFixed(1) +
          '%';
      }
      qa.paused = paused;
    }
    async function selectCharacter(id) {
      const token = ++sequence;
      paused = true;
      pausedUI();
      $('#status').textContent = '正在载入角色…';
      try {
        let model = cache.get(id);
        const record = records.find((r) => r.id === id);
        if (!model) {
          const gltf = await loader.loadAsync('/assets/' + id + '/' + record.runtime);
          const wrapper = new THREE.Group();
          wrapper.add(gltf.scene);
          scene.add(wrapper);
          const mixer = new THREE.AnimationMixer(gltf.scene);
          mixer.clipAction(THREE.AnimationClip.findByName(gltf.animations, 'Idle')).play();
          mixer.update(0);
          gltf.scene.updateMatrixWorld(true);
          let mesh;
          gltf.scene.traverse((o) => {
            if (o.isSkinnedMesh) mesh = o;
          });
          const pelvis = mesh.skeleton.bones.find((b) => b.name === 'pelvis'),
            center = new THREE.Vector3();
          pelvis.getWorldPosition(center);
          gltf.scene.position.x -= center.x;
          model = { record, wrapper, mixer, clips: gltf.animations, mesh };
          cache.set(id, model);
        }
        if (token !== sequence) {
          model.wrapper.visible = false;
          return;
        }
        for (const m of cache.values()) m.wrapper.visible = m === model;
        current = model;
        $('#actions').replaceChildren();
        for (const s of record.modules) {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'series-button series-button--secondary';
          button.dataset.clip = s.clip;
          button.textContent = s.label;
          button.onclick = () => selectModule(s);
          $('#actions').append(button);
        }
        gaitTime = 0;
        selectModule(
          record.modules[0],
          !matchMedia('(prefers-reduced-motion: reduce)').matches,
          false,
        );
        resize();
        qa.ready = true;
        $('#status').textContent =
          record.name + ' · 3 招 / 受击 / 后撤 · ' + record.clips.length + ' 个实际导出片段';
      } catch (e) {
        qa.errors.push(String(e));
        $('#status').textContent = '载入失败：' + e.message;
      }
    }
    for (const r of records) {
      const o = document.createElement('option');
      o.value = r.id;
      o.textContent = r.name;
      $('#character').append(o);
    }
    $('#character').value = 'wukong';
    $('#character').onchange = (e) => selectCharacter(e.target.value);
    $('#play').onclick = () => selectModule(spec);
    $('#pause').onclick = () => {
      paused = !paused;
      pausedUI();
    };
    $('#phase').oninput = (e) => {
      paused = true;
      pausedUI();
      time = (Number(e.target.value) / 100) * spec.duration;
      sample();
    };
    $('#moving').onclick = (e) => {
      moving = !moving;
      e.currentTarget.setAttribute('aria-pressed', String(moving));
      gaitTime = gaitStart + Math.min(time, spec.duration);
      selectModule(spec);
    };
    $('#slow').onclick = (e) => {
      slow = !slow;
      e.currentTarget.setAttribute('aria-pressed', String(slow));
    };
    $('#loop').onclick = (e) => {
      loop = !loop;
      e.currentTarget.setAttribute('aria-pressed', String(loop));
    };
    $('#flip').onclick = (e) => {
      flip = !flip;
      e.currentTarget.setAttribute('aria-pressed', String(flip));
      sample();
    };
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        paused = true;
        pausedUI();
      }
    });
    await selectCharacter('wukong');
    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000) * (slow ? 0.5 : 1);
      last = now;
      if (!paused && spec) {
        time += dt;
        if (time >= spec.duration + 0.35 && loop) {
          gaitTime = gaitStart + spec.duration;
          selectModule(spec);
        } else sample();
      }
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</html>

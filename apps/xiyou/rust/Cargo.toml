[package]
name = "cfgcn-xiyou"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
crowd-benchmark = ["cfgcn-game-core/crowd-benchmark"]

[dependencies]
cfgcn-game-core = { path = "../../../packages/game-core" }
serde.workspace = true
serde_json.workspace = true
bevy = { version = "=0.20.0", default-features = false, features = ["std", "default_app", "bevy_winit", "bevy_render", "bevy_core_pipeline", "bevy_gltf", "bevy_pbr", "gltf_animation", "bevy_log", "webgl2", "web", "png", "jpeg", "multi_threaded"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.118"
